import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLZPk_Bvh4crUEsBAN9gso3HAUTPBNpLc",

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// ── PENDING ──────────────────────────────────────────────
window._fbSavePending = async function(data) {
  try {
    await addDoc(collection(db, "pending"), data);
    return true;
  } catch(e) {
    console.error("Error guardando pending:", e);
    return false;
  }
};

window._fbListenPending = function(callback) {
  const q = query(collection(db, "pending"), orderBy("timestamp", "desc"));
  return onSnapshot(q, (snapshot) => {
    const items = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
    callback(items);
  });
};

window._fbDeletePending = async function(id) {
  try {
    await deleteDoc(doc(db, "pending", id));
    return true;
  } catch(e) {
    console.error("Error eliminando pending:", e);
    return false;
  }
};

// ── PLAYERS ──────────────────────────────────────────────
window._fbSavePlayer = async function(player) {
  try {
    await setDoc(doc(db, "players", player.id), player);
    return true;
  } catch(e) {
    console.error("Error guardando player:", e);
    return false;
  }
};

window._fbDeletePlayer = async function(id) {
  try {
    await deleteDoc(doc(db, "players", id));
    return true;
  } catch(e) {
    console.error("Error eliminando player:", e);
    return false;
  }
};

window._fbListenPlayers = function(callback) {
  return onSnapshot(collection(db, "players"), (snapshot) => {
    const items = snapshot.docs.map(d => ({...d.data()}));
    callback(items);
  });
};

// ── MIS SESIONES ─────────────────────────────────────────
window._fbSaveMySession = async function(session) {
  try {
    await setDoc(doc(db, "mySessions", session.id), session);
    return true;
  } catch(e) {
    console.error("Error guardando mySession:", e);
    return false;
  }
}
